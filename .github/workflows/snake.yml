name: generate animation

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  # 移除 push 触发器，或改为仅允许 PR 合并后触发
  pull_request:
    types: [closed]
    branches: [main, master]

jobs:
  generate:
    # 最小化权限：仅授予必要权限
    permissions:
      contents: write  # 仅用于推送SVG到output分支
      actions: read
      # 如果不需要写入，可进一步限制为 read
      # contents: read
    
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. 验证触发来源（针对PR合并场景）
      - name: Check PR merge status
        if: github.event.pull_request.merged == false
        run: |
          echo "Pull request was not merged, skipping..."
          exit 1

      # 2. 检出代码（使用固定版本的官方action）
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false  # 减少凭据暴露风险

      # 3. 生成SVG（使用固定SHA版本）
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@a274fa9753b3c7df3e4d5d1ab543fbd04ed0f6c8 # v3.2.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 4. 验证生成的内容（防止恶意注入）
      - name: Validate generated SVG
        run: |
          if ! grep -q "svg" dist/github-contribution-grid-snake.svg; then
            echo "Generated file is not a valid SVG"
            exit 1
          fi
          # 检查是否包含可疑的script标签
          if grep -q "<script" dist/*.svg; then
            echo "Suspicious script tag found in SVG"
            exit 1
          fi

      # 5. 推送到output分支（使用固定SHA版本）
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@fbf0a4fa4fecb8095f6d2549507c40a18d5c8e73 # v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. 安全审计日志
      - name: Security audit log
        if: always()
        run: |
          echo "Workflow completed by: ${{ github.actor }}"
          echo "Trigger event: ${{ github.event_name }}"
          echo "SHA: ${{ github.sha }}"
